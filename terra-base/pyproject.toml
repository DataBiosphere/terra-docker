[project]
name = "terra-base"
version = "0.0.1"
description = "Minimal Jupyter environment for Terra notebooks"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "jupyter-contrib-nbextensions==0.7.0",
    "jupyter-core>=5.8.1",
    "jupyter-server==1.24.0",
    "jupyterlab==3.4.8",
    "jupyterlab-server==2.23.0",
    "nbclassic>=1.3.1",
    "nbconvert>=7.16.6",
    "nbstripout>=0.8.1",
    "notebook==6.5.4",
    "requests>=2.29.0",
    "tornado>=6.5.1",
]

[tool.uv]
no-build-isolation = true
build-constraint-dependencies = ["setuptools==59.8.0"] # required for firecloud
