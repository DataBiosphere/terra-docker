[project]
name = "terra-base"
version = "1.0.0"
description = "Minimal Jupyter environment for Terra notebooks"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyter-contrib-nbextensions==0.7.0",
    "jupyter-core==5.3.1",
    "jupyter-server==1.24.0",
    "jupyter-server-proxy==4.0.0",
    "jupyterlab==4.4.8",
    "jupyterlab-server==2.23.0",
    "nbclassic>=1.3.1",
    "nbconvert>=7.16.6",
    "nbstripout>=0.8.1",
    "notebook==6.5.4",
    "python-datauri>=3.0.2",
    "requests>=2.29.0",
    "tornado>=6.5.1",
    "traitlets==5.9.0",
]

build-constraint-dependencies =[
    "setuptools>=70.3.0",
    "wheel>=0.45.1"
]

