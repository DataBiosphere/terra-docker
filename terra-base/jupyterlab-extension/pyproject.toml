[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.6,<5", "jupyter-builder>=1.3", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "terra_jupyterlab_extension"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
]
dependencies = []
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["terra_jupyterlab_extension/labextension"]
exclude = [".github", "node_modules", ".yarn", "lib"]

[tool.hatch.build.targets.wheel]
# Generated at build time and git-ignored, so it must be listed to land in the wheel.
artifacts = ["terra_jupyterlab_extension/_version.py"]

[tool.hatch.build.targets.wheel.shared-data]
"terra_jupyterlab_extension/labextension" = "share/jupyter/labextensions/terra-jupyterlab-extension"
"install.json" = "share/jupyter/labextensions/terra-jupyterlab-extension/install.json"

[tool.hatch.build.hooks.version]
path = "terra_jupyterlab_extension/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "terra_jupyterlab_extension/labextension/static/style.js",
    "terra_jupyterlab_extension/labextension/package.json",
]
skip-if-exists = ["terra_jupyterlab_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]
