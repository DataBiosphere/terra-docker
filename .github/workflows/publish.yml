name: Publish image to GCR
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to publish'
        required: true
        type: choice
        options:
          - terra-base
          - terra-jupyter-base
          - terra-jupyter-bioconductor
          - terra-jupyter-gatk
          - terra-jupyter-hail
          - terra-jupyter-python
          - terra-jupyter-r
        default: terra-rstudio-rstudio
      branch:
        description: 'Branch to run the workflow on'
        required: false
        default: 'master'
jobs:
  publish-job:
    runs-on: self-hosted
    env:
      # Create a plain image, not an attestation manifest list.
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
    steps:
      - name: Checkout current code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Free up some disk space
        run: sudo rm -rf /usr/share/dotnet

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.TD_GCP_SA_KEY }}
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Explicitly auth Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Set up Docker Buildx
        # build.sh creates and uses its own docker-container builder (TERRA_BUILDER)
        # to push, so this builder is only the default for any other buildx calls.
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build Docker image and publish
        run: |
          gcloud auth configure-docker
          ./build.sh ${{ github.event.inputs.image }} "true"
