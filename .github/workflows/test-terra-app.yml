name: Test terra-app
# Builds terra-core and terra-app and checks terra-app against what Leonardo's RStudio code path
# expects (see terra-app/README.md).

on:
  pull_request:
    branches: [ master ]
    paths:
    - 'terra-core/**'
    - 'terra-app/**'
    - 'build_smoke_test_image.sh'
    - '.github/workflows/test-terra-app.yml'

  workflow_dispatch:

env:
  # Create a plain image, not an attestation manifest list.
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:

  test_docker_image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build Docker image and base images too, if needed
      run: ./build_smoke_test_image.sh terra-app

    - name: Check the Leonardo contract
      run: ./terra-app/tests/contract_test.sh terra-app:smoke-test
