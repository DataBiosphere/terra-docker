name: Test terra-base
# Builds terra-core and terra-base, checks terra-base against what Leonardo and Terra UI expect,
# and runs its Python tests (see terra-base/tests).

on:
  pull_request:
    branches: [ master ]
    paths:
    - 'terra-core/**'
    - 'terra-base/**'
    - 'build_smoke_test_image.sh'
    - '.github/workflows/test-terra-base.yml'

  workflow_dispatch:

env:
  # Create a plain image, not an attestation manifest list.
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:

  test_docker_image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build Docker image and base images too, if needed
      run: ./build_smoke_test_image.sh terra-base

    - name: Check the Leonardo contract
      run: ./terra-base/tests/contract_test.sh terra-base:smoke-test
