[project]
name = "terra-jupyter"
version = "1.0.0"
description = "Minimal Jupyter environment for Terra notebooks"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "ipykernel==7.4.0",
    "jupyter-core==5.9.1",
    "jupyter-server==2.21.1",
    "jupyter-server-proxy==4.6.1",
    "jupyterlab==4.6.6",
    "jupyterlab-server==2.28.1",
    "nbconvert==7.17.2",
    "nbstripout==0.9.2",
    "notebook==7.6.5",
    "python-datauri==3.0.2",
    "requests==2.34.2",
    "tornado==6.6.1",
    "traitlets==5.16.1",
]
